<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 38" width="160" height="38" fill="none">
  <title>ChatConnect</title>
  <defs>
    <!-- Gradiente Omnicanal para el texto Connect -->
    <linearGradient id="text-brand-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="pulse-dot-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Texto Principal: Chat -->
  <text x="2" y="24" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="23" 
        font-weight="900" 
        letter-spacing="-0.6" 
        fill="#0f172a">Chat</text>

  <!-- Texto Principal: Connect -->
  <text x="56" y="24" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="23" 
        font-weight="900" 
        letter-spacing="-0.6" 
        fill="url(#text-brand-dark)">Connect</text>

  <!-- Arco de Conexión y Nodo Inteligente de Estado Activo -->
  <circle cx="55" cy="8" r="2.8" fill="url(#pulse-dot-dark)" />
  <circle cx="55" cy="8" r="1.2" fill="#ffffff" />
  <path d="M 50 12 C 53 9.5, 57 9.5, 60 12" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Subtítulo de categoría de producto -->
  <text x="3" y="34" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="6.8" 
        font-weight="700" 
        letter-spacing="1.8" 
        fill="#64748b">CRM OMNICANAL CON IA</text>
</svg>
