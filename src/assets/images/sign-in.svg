<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filtros de sombra suave de alta gama -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.06" />
    </filter>

    <filter id="shadow-node" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <filter id="glow-ambient-1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
    <filter id="glow-ambient-2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <!-- Degradados -->
    <linearGradient id="grad-mesh-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="grad-mesh-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="brand-emblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="wa-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="ai-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="crm-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="orders-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="card-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="line-glow-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="line-glow-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <!-- Gradiente WhatsApp Principal (Esmeralda a Menta) -->
    <linearGradient id="grad-whatsapp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente Omnicanal / Instagram / Bots (Cian a Violeta a Magenta) -->
    <linearGradient id="grad-omnichannel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gradiente de Fusión Central (Conexión Inteligente) -->
    <linearGradient id="grad-fusion" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Gradiente Omnicanal para el texto Connect -->
    <linearGradient id="text-brand-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="pulse-dot-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Sombras suaves de profundidad para el logo oficial -->
    <filter id="shadow-bubble-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.35" />
    </filter>

    <filter id="shadow-bubble-2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>

    <filter id="glow-dot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Atmósfera de fondo suave y limpia -->
  <circle cx="120" cy="140" r="130" fill="url(#grad-mesh-1)" filter="url(#glow-ambient-1)" />
  <circle cx="410" cy="130" r="120" fill="url(#grad-mesh-2)" filter="url(#glow-ambient-2)" />
  <circle cx="260" cy="400" r="140" fill="url(#grad-mesh-1)" filter="url(#glow-ambient-1)" />

  <!-- Patrón de cuadrícula isométrica minimalista muy tenue -->
  <g opacity="0.04" stroke="#0f172a" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="520" />
    <line x1="100" y1="0" x2="100" y2="520" />
    <line x1="160" y1="0" x2="160" y2="520" />
    <line x1="220" y1="0" x2="220" y2="520" />
    <line x1="280" y1="0" x2="280" y2="520" />
    <line x1="340" y1="0" x2="340" y2="520" />
    <line x1="400" y1="0" x2="400" y2="520" />
    <line x1="460" y1="0" x2="460" y2="520" />

    <line x1="0" y1="60" x2="520" y2="60" />
    <line x1="0" y1="120" x2="520" y2="120" />
    <line x1="0" y1="180" x2="520" y2="180" />
    <line x1="0" y1="240" x2="520" y2="240" />
    <line x1="0" y1="300" x2="520" y2="300" />
    <line x1="0" y1="360" x2="520" y2="360" />
    <line x1="0" y1="420" x2="520" y2="420" />
    <line x1="0" y1="480" x2="520" y2="480" />
  </g>

  <!-- Líneas orgánicas que conectan los canales con el núcleo central -->
  <path d="M 160 115 C 190 170, 210 200, 240 230" stroke="url(#line-glow-1)" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M 360 115 C 330 170, 310 200, 280 230" stroke="url(#line-glow-2)" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M 160 410 C 195 365, 215 330, 240 300" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M 360 410 C 325 365, 305 330, 280 300" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <!-- Círculos de onda / radar concéntricos sutiles -->
  <circle cx="260" cy="260" r="160" stroke="#0284c7" stroke-opacity="0.08" stroke-width="1.5" fill="none" />
  <circle cx="260" cy="260" r="195" stroke="#10b981" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="6 6" fill="none" />

  <!-- ================= NÚCLEO CENTRAL (TARJETA CHATCONNECT) ================= -->
  <g filter="url(#shadow-main)">
    <!-- Base de la tarjeta de cristal blanco -->
    <rect x="110" y="150" width="300" height="225" rx="24" fill="#ffffff" fill-opacity="0.95" />
    <rect x="110" y="150" width="300" height="225" rx="24" stroke="url(#card-stroke)" stroke-width="1.5" />

    <!-- Cabecera de la tarjeta con Logo Oficial ChatConnect (Idéntico a Login) -->
    <g transform="translate(132, 172)">
      <!-- Logo Icono (logo-sm): Burbujas duales WhatsApp + Omnicanal -->
      <g transform="translate(0, 0)">
        <!-- BURBUJA 1: WHATSAPP / CANAL PRIMARIO (Inferior Izquierda) -->
        <g filter="url(#shadow-bubble-1)">
          <path d="M 17 6 C 9.8 6 4 11.6 4 18.5 C 4 21.2 4.9 23.7 6.4 25.8 L 4.5 32 L 11 30.3 C 12.8 31.4 14.8 32 17 32 C 24.2 32 30 26.4 30 19.5 C 30 12.6 24.2 6 17 6 Z" 
                fill="url(#grad-whatsapp)" />
          <path d="M 8 16 C 8 11.5 12 8 17 8 C 22 8 26 11 26.5 15 C 23.5 12 19 11 15 12 C 11.5 13 9.5 14.5 8 16 Z" 
                fill="#ffffff" opacity="0.28" />
        </g>

        <!-- BURBUJA 2: OMNICANAL / INSTAGRAM & BOTS (Superior Derecha) -->
        <g filter="url(#shadow-bubble-2)">
          <path d="M 27 12 C 19.8 12 14 17.6 14 24.5 C 14 27.2 14.9 29.7 16.4 31.8 L 14.5 38 L 21 36.3 C 22.8 37.4 24.8 38 27 38 C 34.2 38 40 32.4 40 25.5 C 40 18.6 34.2 12 27 12 Z" 
                fill="url(#grad-omnichannel)" 
                opacity="0.94" />
          <path d="M 18 22 C 18 17.5 22 14 27 14 C 32 14 36 17 36.5 21 C 33.5 18 29 17 25 18 C 21.5 19 19.5 20.5 18 22 Z" 
                fill="#ffffff" opacity="0.32" />
        </g>

        <!-- INTERSECCIÓN & NODOS DE CONEXIÓN INTELIGENTE (IA & SYNC) -->
        <path d="M 18 22 C 20 20, 24 20, 26 22 C 24 24, 20 24, 18 22 Z" fill="#ffffff" opacity="0.6" />
        <circle cx="15" cy="22" r="2.2" fill="#ffffff" filter="url(#glow-dot)" />
        <circle cx="15" cy="22" r="1.1" fill="#10b981" />
        <circle cx="22" cy="22" r="2.6" fill="#ffffff" filter="url(#glow-dot)" />
        <circle cx="22" cy="22" r="1.4" fill="#06b6d4" />
        <circle cx="29" cy="22" r="2.2" fill="#ffffff" filter="url(#glow-dot)" />
        <circle cx="29" cy="22" r="1.1" fill="#8b5cf6" />
      </g>

      <!-- Tipografía y Marca Oficial (logo-dark) -->
      <g transform="translate(50, 2)">
        <!-- Texto Principal: Chat -->
        <text x="2" y="24" 
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
              font-size="23" 
              font-weight="900" 
              letter-spacing="-0.6" 
              fill="#0f172a">Chat</text>

        <!-- Texto Principal: Connect -->
        <text x="56" y="24" 
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
              font-size="23" 
              font-weight="900" 
              letter-spacing="-0.6" 
              fill="url(#text-brand-dark)">Connect</text>

        <!-- Arco de Conexión y Nodo Inteligente de Estado Activo -->
        <circle cx="55" cy="8" r="2.8" fill="url(#pulse-dot-dark)" />
        <circle cx="55" cy="8" r="1.2" fill="#ffffff" />
        <path d="M 50 12 C 53 9.5, 57 9.5, 60 12" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8" />

        <!-- Subtítulo de categoría de producto -->
        <text x="3" y="34" 
              font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
              font-size="6.8" 
              font-weight="700" 
              letter-spacing="1.8" 
              fill="#64748b">OMNICHANNEL AI CRM</text>
      </g>
    </g>

    <!-- Divisor sutil -->
    <line x1="132" y1="240" x2="388" y2="240" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Mensaje 1: Consulta del Cliente (Limpio y minimalista) -->
    <g transform="translate(132, 256)">
      <rect x="0" y="0" width="180" height="34" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#0284c7" />
      <text x="28" y="21" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="11.5" fill="#334155">¿Tienen stock disponible?</text>
    </g>

    <!-- Mensaje 2: Respuesta Automatizada de la IA ChatConnect -->
    <g transform="translate(196, 300)">
      <rect x="0" y="0" width="192" height="36" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <!-- Icono de robot / IA -->
      <circle cx="16" cy="18" r="8" fill="#10b981" />
      <path d="M 13 18 L 15 20 L 20 15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="30" y="16" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="10" fill="#065f46">ChatConnect IA</text>
      <text x="30" y="28" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="11" fill="#047857">Stock verificado en bodega ✓</text>
    </g>

    <!-- Barra de estado inferior: Conectado a la API Oficial -->
    <g transform="translate(132, 350)">
      <circle cx="5" cy="5" r="4" fill="#10b981" />
      <text x="16" y="8.5" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#64748b">
        Meta Cloud API <tspan fill="#10b981">• En Línea</tspan>
      </text>
    </g>
  </g>

  <!-- ================= NODOS / SATÉLITES MULTICANAL ================= -->

  <!-- Nodo 1: WhatsApp Oficial (Superior Izquierda) -->
  <g filter="url(#shadow-node)" transform="translate(38, 85)">
    <rect x="0" y="0" width="156" height="50" rx="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="25" cy="25" r="16" fill="url(#wa-node-grad)" />
    <!-- Icono WhatsApp -->
    <path d="M 19 25 C 19 21.68, 21.68, 19, 25, 19 C 28.32, 19, 31, 21.68, 31, 25 C 31, 28.32, 28.32, 31, 25, 31 C 23.85, 31, 22.78, 30.68, 21.86, 30.12 L 19 31 L 19.9, 28.3 C 19.33, 27.32, 19, 26.2, 19, 25 Z" fill="#ffffff" />
    <text x="48" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="12" fill="#0f172a">WhatsApp</text>
    <text x="48" y="36" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#16a34a">Meta Cloud API</text>
  </g>

  <!-- Nodo 2: Inteligencia Artificial Gemini (Superior Derecha) -->
  <g filter="url(#shadow-node)" transform="translate(326, 85)">
    <rect x="0" y="0" width="156" height="50" rx="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="25" cy="25" r="16" fill="url(#ai-node-grad)" />
    <!-- Icono IA Sparkle -->
    <path d="M 25 18 Q 25 25 32 25 Q 25 25 25 32 Q 25 25 18 25 Q 25 25 25 18 Z" fill="#ffffff" />
    <circle cx="21" cy="21" r="1.5" fill="#ffffff" opacity="0.8" />
    <text x="48" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="12" fill="#0f172a">IA Inteligente</text>
    <text x="48" y="36" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#7c3aed">Cotiza y Atiende</text>
  </g>

  <!-- Nodo 3: CRM y Multi-Agente (Inferior Izquierda) -->
  <g filter="url(#shadow-node)" transform="translate(42, 385)">
    <rect x="0" y="0" width="156" height="50" rx="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="25" cy="25" r="16" fill="url(#crm-node-grad)" />
    <!-- Icono Personas / Agentes -->
    <circle cx="25" cy="22" r="3.5" fill="#ffffff" />
    <path d="M 19 30 C 19 27.24, 21.24, 25, 24 25 L 26 25 C 28.76, 25, 31, 27.24, 31, 30 Z" fill="#ffffff" />
    <text x="48" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="12" fill="#0f172a">Multi-Agente</text>
    <text x="48" y="36" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#0284c7">Consola Unificada</text>
  </g>

  <!-- Nodo 4: Pedidos en Tiempo Real (Inferior Derecha) -->
  <g filter="url(#shadow-node)" transform="translate(322, 385)">
    <rect x="0" y="0" width="160" height="50" rx="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="25" cy="25" r="16" fill="url(#orders-node-grad)" />
    <!-- Icono Carrito / Caja de pedido -->
    <path d="M 20 22 L 30 22 L 29 29 C 29 30.1, 28.1, 31, 27 31 L 23 31 C 21.9, 31, 21 30.1, 21 29 Z" fill="#ffffff" />
    <path d="M 23 22 L 23 20 C 23 18.9, 23.9, 18, 25 18 C 26.1, 18, 27 18.9, 27 20 L 27 22" stroke="#ffffff" stroke-width="1.2" fill="none" />
    <text x="48" y="22" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="12" fill="#0f172a">Órdenes y Stock</text>
    <text x="48" y="36" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#059669">Gestión en Vivo</text>
  </g>

  <!-- Pequeños acentos decorativos luminosos (Sparkles) -->
  <path d="M 120 70 Q 120 75 125 75 Q 120 75 120 80 Q 120 75 115 75 Q 120 75 120 70 Z" fill="#10b981" opacity="0.6" />
  <path d="M 420 220 Q 420 224 424 224 Q 420 224 420 228 Q 420 224 416 224 Q 420 224 420 220 Z" fill="#38bdf8" opacity="0.7" />
  <path d="M 100 350 Q 100 354 104 354 Q 100 354 100 358 Q 100 354 96 354 Q 100 354 100 350 Z" fill="#6366f1" opacity="0.6" />
</svg>
